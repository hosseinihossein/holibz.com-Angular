name: Deploy Output Files to Server

on:
  push:
    branches:
      - main # Triggers the workflow when you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch the project files from the repository
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Setup the SSH key securely using the SSH agent
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3. Add your server to known hosts to prevent "host verification failed" errors
      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # 4. Sync files to the server using rsync
      - name: Deploy files via Rsync
        run: |
          rsync -avz --delete \
            ./AngApp/MyOutput/browser/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/myApps/nginx/html/

      # 5. Create Storage Directories for named volumes
      - name: Create Storage Directories
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e # Stop execution if any command fails

            # Create storage directories for named volumes 
            mkdir -p /opt/myApps/nginx/html/Storage/UserAvatar
            mkdir -p /opt/myApps/nginx/html/Storage/LibraryImage
          EOF
