<mat-sidenav-container>
    <mat-sidenav id="" [opened]="sidenavOpen()" mode="side" position="start" style="position: absolute;">
        @if(isMe()){
        <button matButton="" (click)="openNewLibraryForm()">
            <mat-icon>add_box</mat-icon>
            Create New Library
        </button>
        }
    </mat-sidenav>

    <mat-sidenav-content>
        <div style="float: inline-start;">
            <button matMiniFab (click)="toggleSidenavOpen()"
                [matTooltip]="sidenavOpen() ? 'Close panel' : 'Open panel'">
                <mat-icon>{{sidenavOpen() ? 'left_panel_close' : 'left_panel_open'}}</mat-icon>
            </button>
        </div>
        <div class="list">
            @for(libId of libIds(); track libId){
            <app-library-card [libraryId]="libId"></app-library-card>
            }
        </div>

    </mat-sidenav-content>

</mat-sidenav-container>
