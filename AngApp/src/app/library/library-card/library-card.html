<mat-card appearance="outlined">
    <mat-card-header>
        @if(libCardInfo.value()?.imageUrl){
        <img [ngSrc]="libCardInfo.value()?.imageUrl!" width="40" height="40" alt="library logo" matCardAvatar>
        }
        @else {
        <mat-icon matCardAvatar style="font-size: 36px;text-align: center;/*width: 40px;height: 40px;*/">
            account_balance
        </mat-icon>
        }
        <mat-card-title>{{libCardInfo.value()?.title}}</mat-card-title>
        <mat-card-subtitle>
            <a [routerLink]='["/UserAccount/Profile/",libCardInfo.value()?.ownerId]'>
                {{ownerUsername.value()?.username}}
            </a>
        </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <p style="font-size: 12px;">{{libCardInfo.value()?.description}}</p>
        <!--h4 style="margin: 8px 0;">Shelves:</h4>
        <ul style="margin: 0;padding-left: 16px;">
            @for(shelfTitle of libCardInfo.value()?.shelves; track shelfTitle){
            <li>{{shelfTitle}}</li>
            }
        </ul-->
    </mat-card-content>
</mat-card>
