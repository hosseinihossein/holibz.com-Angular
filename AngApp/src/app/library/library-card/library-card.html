<mat-card appearance="outlined">
    <mat-card-header>
        @if(libCardInfo.value()?.imageUrl){
        <img [ngSrc]="libCardInfo.value()?.imageUrl!" width="40" height="40" alt="library logo" matCardAvatar>
        }
        @else {
        <mat-icon matCardAvatar style="font-size: 36px;text-align: center;">
            shelves
        </mat-icon>
        }
        <mat-card-title>{{libCardInfo.value()?.title}}</mat-card-title>
        <mat-card-subtitle>
            <a [routerLink]="['/UserAccount/Profile', libCardInfo.value()?.ownerId]" style="text-wrap: wrap;">
                {{ownerUsername.value()?.username}}
            </a>
        </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <p style="font-size: 12px;">{{libCardInfo.value()?.description}}</p>
    </mat-card-content>

    <mat-card-footer>
        <mat-icon>bookmark</mat-icon>105
        <mat-icon>shelves</mat-icon>7
        <mat-icon>docs</mat-icon>53
    </mat-card-footer>

</mat-card>
