<mat-card appearance="outlined">
    <app-card-tag iconName="shelves" tagName="Library"></app-card-tag>
    <mat-card-header>
        <div style="float: inline-start;position: relative;">
            <button matIconButton class="edit-btn" style="position: absolute;bottom: 0;right: -8px;"
                matTooltip="Set a new image" (click)="setImage()">
                <mat-icon>edit</mat-icon>
            </button>
            <button matIconButton class="edit-btn"
                style="position: absolute;bottom: 0;left: -8px; color: var(--mat-sys-error);"
                matTooltip="Delete the image" (click)="deleteImage()">
                <mat-icon>delete</mat-icon>
            </button>
            @if(libCardInfo.value()?.imageUrl){
            <img [ngSrc]="libCardInfo.value()!.imageUrl!" priority width="100" height="100" alt="user image"
                id="header-img">
            }
            @else {
            <mat-icon style="font-size: 100px;width: 100px;height: 100px;">shelves</mat-icon>
            }
        </div>

        <div style="float: inline-start;position: relative;">
            <mat-card-title>
                <p style="margin: 0;">
                    {{libCardInfo.value()?.title}}
                    <button matIconButton class="edit-btn" style="transform: translateY(-4px);float: right;"
                        matTooltip="Edit name" (click)="setTitle()">
                        <mat-icon>edit</mat-icon>
                    </button>
                </p>
            </mat-card-title>

        </div>

    </mat-card-header>

    <mat-card-content class="clearfix">
        <pre style="text-wrap: wrap;">{{libCardInfo.value()?.description}}</pre>
        <button matIconButton class="edit-btn" style="transform: translateY(-16px);float: right;"
            matTooltip="Edit description" (click)="setDescription()">
            <mat-icon>edit</mat-icon>
        </button>
    </mat-card-content>

    <mat-card-actions align="end">
        <a matButton="" [routerLink]="['/Library',libId()]">
            Ok
        </a>
    </mat-card-actions>

    @if(displayWaitSpinner()){
    <app-wait-spinner></app-wait-spinner>
    }

</mat-card>
