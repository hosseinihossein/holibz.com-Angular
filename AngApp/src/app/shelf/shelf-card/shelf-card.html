<mat-expansion-panel hideToggle expanded>
    <app-card-tag tagName="newsstand" iconName="Shelf"></app-card-tag>
    <mat-expansion-panel-header>
        <mat-panel-title>
            <div class="icon-box" [matBadge]="shelfCardInfo.value()?.totalNumberOfDocs" matBadgePosition="above">
                @if(shelfCardInfo.hasValue() && shelfCardInfo.value().imageUrl){
                <img [ngSrc]="shelfCardInfo.value().imageUrl!" width="40" height="40" alt="shelf image">
                }
                @else {
                <mat-icon>newsstand</mat-icon>
                }
            </div>
            &nbsp;
            &nbsp;
            {{shelfCardInfo.value()?.title}}
        </mat-panel-title>
        <mat-panel-description>
            {{shelfCardInfo.value()?.description}}
        </mat-panel-description>

        <a [routerLink]="['/UserAccount/Profile',shelfCardInfo.value()?.ownerId]">
            @if(ownerAvatarUrl()){
            <img id="owner-username" [ngSrc]="ownerAvatarUrl()!" priority width="40" height="40" alt="user image"
                [matTooltip]="ownerUsername()">
            }
            @else {
            <mat-icon style="font-size: 50px;width: 50px;height: 50px;"
                [matTooltip]="ownerUsername()">account_circle</mat-icon>
            }
        </a>
    </mat-expansion-panel-header>

    <div class="listOfDocs">
        @for (docId of docIds.value()?.docIds; track docId) {
        <app-document-mini-card [docId]="docId" (click)="router.navigate(['/Document',docId])"
            style="cursor: pointer;"></app-document-mini-card>
        }
    </div>

    <mat-action-row>
        <button matButton (click)="openShelf()">Open</button>
    </mat-action-row>

</mat-expansion-panel>
