<mat-card appearance="outlined">
    <app-card-tag iconName="newsstand" tagName="Shelf"></app-card-tag>
    <mat-card-header>
        <div style="float: inline-start;position: relative;">
            @if(shelfCardInfo.value()?.imageUrl){
            <img [ngSrc]="shelfCardInfo.value()!.imageUrl!" priority width="100" height="100" alt="user image"
                id="header-img">
            }
            @else {
            <mat-icon style="font-size: 100px;width: 100px;height: 100px;">shelves</mat-icon>
            }
        </div>

        <div style="float: inline-start;position: relative;">
            <mat-card-title>
                <p style="margin: 0;">
                    {{shelfCardInfo.value()?.title}}
                </p>
            </mat-card-title>

            <mat-card-subtitle>
                {{ownerUsername()}}
            </mat-card-subtitle>

        </div>

    </mat-card-header>

    <mat-card-content class="clearfix">
        <pre style="text-wrap: wrap;">{{shelfCardInfo.value()?.description}}</pre>
    </mat-card-content>

    <mat-card-actions align="end">
        @if(isMine()){
        <a matButton="" [routerLink]="['/Shelf/Setting',shelfId()]">
            <mat-icon>edit_note</mat-icon>
            Edit Shelf
        </a>
        }
    </mat-card-actions>

</mat-card>

<app-document-list [docIds]="docIds.value()?.docIds ?? []" [isMine]="isMine()" [parentShelfId]="shelfId()!"
    (reload)="docIds.reload()">
</app-document-list>
