<mat-card appearance="outlined">
    <mat-card-header>
        <div style="float: inline-start;position: relative;">
            @if(profileInfo.value()?.avatarUrl){
            <img [ngSrc]="profileInfo.value()!.avatarUrl!" priority width="100" height="100" alt="user image"
                id="user-profile-img">
            }
            @else {
            <mat-icon style="font-size: 100px;width: 100px;height: 100px;">account_circle</mat-icon>
            }
        </div>

        <div style="float: inline-start;position: relative;">
            <mat-card-title>
                <p class="persian-font" style="margin: 0;">
                    {{profileInfo.value()?.name}}
                </p>
            </mat-card-title>

            <mat-card-subtitle>
                {{profileUsername.value()}}
            </mat-card-subtitle>

        </div>

    </mat-card-header>

    <mat-card-content class="clearfix">
        <pre>{{profileInfo.value()?.description}}</pre>
    </mat-card-content>

    <mat-card-actions align="end">
        @if(isMe()){
        <a matButton="" [routerLink]="['/UserAccount/ProfileSetting']">
            <mat-icon>person_edit</mat-icon>
            Edit Profile
        </a>
        }
    </mat-card-actions>

</mat-card>

<app-mainboard [userId]="userId()!"></app-mainboard>

@if(displayWaitSpinner()){
<app-wait-spinner></app-wait-spinner>
}
