<mat-card [appearance]="appearance()" [class.raised]="appearance()==='raised'" (mouseenter)="raiseCard()"
    (mouseleave)="outlineCard()">
    <app-card-tag iconName="book_2" tagName="Document"></app-card-tag>
    @if(isMine()){
    <button matIconButton [matMenuTriggerFor]="moreMenu" id="more-btn" matTooltip="More settings">
        <mat-icon>more_horiz</mat-icon>
    </button>
    <mat-menu #moreMenu>
        <button mat-menu-item>Remove from this shelf</button>
    </mat-menu>
    }
    <mat-card-header style="padding: 4px;">
        <a [routerLink]="['/UserAccount/Profile', docCardInfo.value()?.ownerId]" mat-card-avatar>
            @if(ownerAvatarUrl()){
            <img [ngSrc]="ownerAvatarUrl()!" priority width="50" height="50" alt="user image" class="owner-avatar">
            }
            @else {
            <mat-icon style="font-size: 50px;width: 50px;height: 50px;" class="owner-avatar">account_circle</mat-icon>
            }
        </a>
        <!--mat-card-title>
            {{docCardInfo.value()?.title}}
        </mat-card-title-->
        <mat-card-subtitle>
            <a [routerLink]="['/UserAccount/Profile', docCardInfo.value()?.ownerId]">
                {{ownerUsername()}}
            </a>
        </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <h3 style="text-align: center;">{{docCardInfo.value()?.title}}</h3>
        @if(docCardInfo.value()?.imageUrl){
        <img mat-card-image id="main-img" #mainImg [ngSrc]="docCardInfo.value()!.imageUrl!" width="300" height="200"
            alt="document image">
        }
        <p>{{docCardInfo.value()?.description}}</p>
        <!--ul style="margin: 0px;">
            <h4 style="margin-bottom: 0;">Contents:</h4>
            @for(header of documentCardModel()?.headers; track header){
            <li>
                <h3>{{header}}</h3>
            </li>
            }
        </ul-->
    </mat-card-content>

    <!--span style="flex: 1 1 auto;"></span-->

    <mat-card-actions align="end">
        <a matButton [routerLink]="['/Document', docId()]">Open</a>
    </mat-card-actions>
</mat-card>
