<mat-card [appearance]="appearance()" (mouseenter)="raiseCard()" (mouseleave)="outlineCard()">
    <mat-card-header style="padding: 4px;">
        <mat-card-title>
            {{docCardInfo.value()?.title}}
        </mat-card-title>
    </mat-card-header>

    <mat-card-content>
        @if(docCardInfo.value()?.imageUrl){
        <img mat-card-image #mainImg [ngSrc]="docCardInfo.value()?.imageUrl!" width="100" height="100"
            alt="document image">
        }
        <p [style.display.block]="!docCardInfo.value()?.imageUrl">
            {{docCardInfo.value()?.description}}
        </p>
    </mat-card-content>
</mat-card>
