<mat-card appearance="outlined">
    <app-card-tag iconName="menu_book" tagName="Document"></app-card-tag>
    @if(isMine()){
    <button matIconButton [matMenuTriggerFor]="moreMenu" id="more-btn" matTooltip="More settings">
        <mat-icon>more_horiz</mat-icon>
    </button>
    <mat-menu #moreMenu>
        <a mat-menu-item>
            <mat-icon>edit</mat-icon> Edit
        </a>
    </mat-menu>
    }
    <mat-card-header style="padding: 4px;">
        <a [routerLink]="['/UserAccount/Profile', docCardInfo.value()?.ownerId]" mat-card-avatar>
            @if(ownerAvatarUrl()){
            <img [ngSrc]="ownerAvatarUrl()!" priority width="50" height="50" alt="user image" class="owner-avatar">
            }
            @else {
            <mat-icon style="font-size: 50px;width: 50px;height: 50px;" class="owner-avatar">account_circle</mat-icon>
            }
        </a>
        <!--mat-card-title>
            <p style="margin: 0;">
                {{docCardInfo.value()?.title}}
            </p>
        </mat-card-title-->
        <mat-card-subtitle>by
            <a [routerLink]="['/UserAccount/Profile', docCardInfo.value()?.ownerId]">
                {{ownerUsername()}}
            </a>
        </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <h1 style="text-align: center;">{{docCardInfo.value()?.title}}</h1>
        @if(docCardInfo.value()?.imageUrl){
        <img mat-card-image id="main-img" #mainImg [ngSrc]="docCardInfo.value()!.imageUrl!" width="600" height="400"
            alt="document image">
        }
        <p style="margin: 16px 0;">{{docCardInfo.value()?.description}}</p>
    </mat-card-content>

    <!--span style="flex: 1 1 auto;"></span-->

    <mat-card-actions align="end">
        <button matButton="tonal">Ok</button>
        <button matButton="filled">
            <mat-icon>cloud_upload</mat-icon>
            Save
        </button>
        <button matButton="outlined">
            <mat-icon>edit_document</mat-icon>
            Edit Content
        </button>
    </mat-card-actions>
</mat-card>
